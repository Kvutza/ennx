[workspace]
members = [
    "cuda",
    "cuda/kernels",
    "rust/crates/bpann",
    "rust/crates/ennx",
    "rust/crates/ennx-py",
    "rust/crates/modal-runner",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["ENNX Contributors"]
repository = "https://github.com/Kvutza/ennx"
keywords = ["bayesian", "optimization", "ENN", "turbo", "turbo-enn"]
categories = ["science", "simulation"]

[workspace.dependencies]
bpann = { package = "ennx-bpann", path = "rust/crates/bpann", version = "=0.1.1" }
ennx = { path = "rust/crates/ennx", version = "=0.1.1", default-features = false }
ndarray = "0.16"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
rand = "0.8"
rand_distr = "0.4"
thiserror = "1.0"
tracy-client = "=0.18.4"
tracy-client-sys = { version = "=0.28.0", default-features = false, features = ["enable"] }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "1f4d813719012d384f2db12b88efc9314c8bf50c" }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "1f4d813719012d384f2db12b88efc9314c8bf50c" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "1f4d813719012d384f2db12b88efc9314c8bf50c" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
