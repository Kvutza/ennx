# Repository checks run by `./ennx check`.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  {
    id = "check-json",
    exclude = "^tests/fixtures/"
  },
  {
    id = "check-added-large-files",
    args = ["--maxkb=500"]
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "forbid-binary",
    name = "Forbid committing binary files",
    entry = "Binary files are not allowed in this repository.",
    language = "fail",
    types = ["binary"],
    exclude = '(?i)\.pdf$'
  },
  {
    id = "kiss-check",
    name = "kiss check",
    entry = "kiss check .",
    language = "system",
    pass_filenames = true
  }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.14.14"
hooks = [
  {
    id = "ruff",
    args = ["--fix"]
  },
  { id = "ruff-format" }
]
