[workspace]
members = [
    "crates/bpann",
    "crates/ennx",
    "crates/ennx-py",
    "crates/modal-runner",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["ENNX Contributors"]
repository = "https://github.com/Kvutza/ennx"
keywords = ["bayesian", "optimization", "ENN", "turbo", "turbo-enn"]
categories = ["science", "simulation"]

[workspace.dependencies]
bpann = { package = "ennx-bpann", path = "crates/bpann", version = "=0.1.0" }
ennx = { path = "crates/ennx", version = "=0.1.0", default-features = false }
ndarray = "0.16"
numpy = "0.22"
pyo3 = { version = "0.22", features = ["extension-module"] }
rand = "0.8"
thiserror = "1.0"
tracy-client = "=0.18.4"
tracy-client-sys = { version = "=0.28.0", default-features = false, features = ["enable"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
