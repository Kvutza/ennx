[buildscript.run]
env = { OPT_LEVEL = "3", DEBUG = "false", PROFILE = "release", NUM_JOBS = "4" }
rustc_link_lib = true
rustc_link_search = true

['cfg(any(target_os = "macos", target_os = "linux"))'.buildscript.run]
env = { CC = "/usr/bin/env clang", CXX = "/usr/bin/env clang++", AR = "/usr/bin/env ar" }
