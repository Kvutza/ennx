[package]
name = "ennx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Epistemic Nearest Neighbor Bayesian Optimization"
readme = "README.md"
build = "build.rs"
include = ["build.rs", "src/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[dependencies]
bpann = { package = "ennx-bpann", version = "0.0.0", path = "../bpann" }
ndarray = { workspace = true }
opencl3 = { version = "0.12.3", optional = true }
rand = "0.8"
rayon = "1.10"
sobol = "1.0.2"
thiserror = { workspace = true }
tracy-client = { workspace = true }
tracy-client-sys = { workspace = true }
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
usearch = { version = "2.26", optional = true, default-features = false }

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33.0", optional = true }

[features]
default = ["metal", "opencl"]
metal = ["dep:metal"]
opencl = ["dep:opencl3"]
usearch = ["dep:usearch"]
usearch-native = []
usearch-numkong = ["dep:usearch", "usearch/numkong"]
zig-dense = []

[dev-dependencies]
approx = "0.5"
ndarray = { workspace = true, features = ["approx"] }
numpy = "0.22"
rand_chacha = "0.3"
tempfile = "3"

[[example]]
name = "apple_gpu_frontier"
required-features = ["metal"]
