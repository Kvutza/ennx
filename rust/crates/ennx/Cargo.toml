[package]
name = "ennx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Epistemic Nearest Neighbor Bayesian Optimization"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[dependencies]
bpann = { workspace = true }
ndarray = { workspace = true }
opencl3 = { version = "0.12.3", optional = true }
rand = "0.8"
rand_distr = { workspace = true }
rayon = "1.10"
sobol = "1.0.2"
thiserror = { workspace = true }
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
usearch = { version = "2.26", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33.0", optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
ennx-cuda = { path = "../../../cuda", optional = true }

[features]
default = ["metal", "opencl"]
cuda = ["dep:ennx-cuda"]
metal = ["dep:metal"]
opencl = ["dep:opencl3"]
usearch = ["dep:usearch"]
usearch-native = []
usearch-numkong = ["dep:usearch", "usearch/numkong"]
zig-dense = []

[dev-dependencies]
numpy = { workspace = true }
rand_chacha = "0.3"
tempfile = "3"

[[example]]
name = "apple_gpu_frontier"
required-features = ["metal"]

[[example]]
name = "cuda_trial"
required-features = ["cuda"]

[[example]]
name = "cuda_dense"
required-features = ["cuda"]
