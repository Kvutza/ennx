[package]
name = "ennx-py"
version.workspace = true
publish = false
edition.workspace = true
build = "src/xpybld.rs"
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Python bindings for ENN core algorithms"
readme = "../../../README.md"

[lib]
name = "ennx_rust"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
ennx = { workspace = true, default-features = false }

[dependencies]
ennx = { workspace = true, default-features = false }
ndarray = { workspace = true }
numpy = { workspace = true }
pyo3 = { workspace = true }
rand = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33.0", optional = true }

[features]
default = []
cuda = ["ennx/cuda"]
native-flame = ["cuda", "ennx/native-flame"]
metal = ["ennx/metal", "dep:metal"]
opencl = ["ennx/opencl"]
usearch = ["ennx/usearch"]
usearch-native = ["ennx/usearch-native"]
usearch-numkong = ["ennx/usearch-numkong"]
