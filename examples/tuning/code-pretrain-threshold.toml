# Complete 4096-token pretraining BO experiment with Bayesian polynomial-
# threshold directions over every model coordinate.
version = 2

experiment = "pretrain"
model = "fbt-pisa1-mhc4-v1"
corpus = "stack-v3-python-800k-v1"

[run]
rounds = 100
target-ms = 200
validation-interval = 64

[proposal]
method = "polynomial-threshold"
distribution = "rademacher"

[enn]
geometry = "latent"
scaling = "self-tuning"
local-neighbors = 8
neighbors = 32

[enn.fit]
neighbors = true
candidates = 64
samples = 64

[acquisition]
method = "augmented-chebyshev"
scales = [1.0, 1.0, 1.0]
preferences = [1.0, 1.0, 1.0]
alpha = 0.0
seed-domain = "code-pretrain-objectives"

[trust-region]
method = "morbo"
regions = 4
rescalarize = "on-restart"
clip = true
shape = "tensor-family-learned"
initial = 0.001
min = 0.0005
max = 0.1

[generation]
purpose = "pretrain"
initialization = "megatron"
max-tokens = 4096
temperature = 0.8
corpus-prompt-tokens = 128

[generation.verify]
mode = "accepted-prefix"
window = 128
max-window = 1024
passes = 2
unroll = 2

[generation.reward]
kind = "code-objectives"
critical-window = 128
