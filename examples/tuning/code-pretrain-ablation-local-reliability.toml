version = 2

experiment = "pretrain"
model = "fbt-pisa1-legacy-v1"
corpus = "stack-v3-python-pilot-v1"

[run]
rounds = 96
target-ms = 1000

[proposal]
distribution = "gaussian"

[enn]
scaling = "self-tuning"
local-neighbors = 8
neighbors = 32
epistemic-scale = 0.05
aleatoric-scale = 0.05

[enn.fit]
neighbors = true
candidates = 64
samples = 64

[acquisition]
method = "ucb"
beta = 0.5

[trust-region]
shape = "tensor-family-learned"
initial = 0.01
min = 0.0001
max = 0.1

method = "reliability"
local-scale-neighbors = 8
evidence-decay = 0.9
progress-decay = 0.8
confidence-z = 1.0
reliability-threshold = 0.6
progress-threshold = 0.1
minimum-evidence = 4.0
target-step-ratio = 0.5
density-gain = 0.25
expand-factor = 1.25
shrink-factor = 0.8
stagnation-patience = 8
escape-rounds = 4
