# Native FineWeb pilot; corpus-prefix NLL, not freely generated-text reward.
# Own 8192-token BPE / billion-weight architecture: not the official speedrun.
version = 2

experiment = "pretrain"
model = "fbt-pisa1-legacy-v1"
corpus = "fineweb-10bt-pilot-v1"

[run]
rounds = 1000
target-ms = 200
selection = "enn"
validation-interval = 4

[proposal]
distribution = "rademacher"

[enn]
epistemic-scale = 0.05
aleatoric-scale = 0.05

[enn.fit]
neighbors = true

[acquisition]
method = "ucb"
beta = 0.75

[trust-region]
method = "turbo"
shape = "tensor-family-static"
initial = 0.01
min = 0.0001
max = 0.1
