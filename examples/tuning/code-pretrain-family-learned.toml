version = 1

[pretrain]
# Billion-weight FBT + PISA attention + MoE on the fixed Python-code corpus.
model = "fbt_pisa1_moe_v1"
corpus = "stack_v3_python_pilot_v1"

[experiment]
trace = false

[rounds]
# Two complete 128-observation windows, including history compaction/restart.
count = 256
reps = 1
target_ms = 1000

[perturbation]
# Independent full-coordinate Gaussian directions.
distribution = "gaussian"

[acquisition]
# Explore without letting uncertainty select the 2x-radius proposal by default.
method = "ucb"
beta = 0.5

[surrogate]
method = "enn"
# Normalize the learned family metric by each point's eighth-neighbor radius.
# This changes both neighbor ranking and inverse-variance weighting.
distance_scaling = "self_tuning"
local_scale_neighbors = 8
# Spend 32 observations on initialization, leaving 96 guided proposals in
# each full history window.
neighbors = 32
fit_neighbors = true
epistemic_scale = 0.05
aleatoric_scale = 0.05
y_scale = 1.0
# Use up to 64 observations per leave-one-out likelihood evaluation and search
# 64 ENN scale candidates after each eligible observation.
fit_candidates = 64
fit_samples = 64

[trust-region]
method = "turbo"
# Learn sensitivities for experts, projections/embeddings, router/feedback,
# and norms. The global trust-region energy remains controlled separately.
shape = "tensor_family_learned"
length_init = 0.01
length_min = 0.0001
length_max = 0.1
