repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # Fixture JSON is stored in Git LFS. Without an LFS smudge checkout the
        # working tree contains pointer files, not JSON documents.
        exclude: ^tests/fixtures/
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Forbid committing binary files and run custom checks
  - repo: local
    hooks:
      # Git LFS leaves the real bytes on disk for smudge/checkout, so pre-commit
      # still classifies *.pdf as binary. Exclude PDFs here; track them via LFS
      # (.gitattributes) and rely on forbid-binary for all other binaries.
      - id: forbid-binary
        name: Forbid committing binary files
        entry: bash -c 'echo \"Binary files are not allowed in this repository.\"; exit 1'
        language: system
        types: [binary]
        exclude: (?i)\.pdf$

      - id: find-forgotten-py
        name: Find forgotten Python files via git status
        entry: admin/find_forgotten_py.sh
        language: system
        pass_filenames: true

      - id: kiss-check
        name: kiss check
        # KISS needs the repository for graph context, then reports only the
        # files being committed. A full-repository coverage audit belongs in CI.
        entry: bash -c 'kiss check . "$@"' --
        language: system
        pass_filenames: true

  # Linting, formatting, and import sorting via Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
