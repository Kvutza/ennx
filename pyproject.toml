[project]
name = "ennx"
version = "0.1.1"
description = "Epistemic Nearest Neighbors"
readme = { file = "README", content-type = "text/plain" }
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = ["numpy>=2.1"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/Kvutza/ennx"
Source = "https://github.com/Kvutza/ennx"

[project.optional-dependencies]
with-deps = [
    "torch>=2.5.1",
    "gpytorch>=1.13",
    "scipy>=1.15.3",
]
dev = [
    "pytest>=8.0",
    "pytest-testmon>=2.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
    "nbmake>=1.5",
    "nds>=0.4.3",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
# Omit --testmon here so `pytest -sv tests` (malvin gates, CI) always runs the full suite.
# Rust/native edits are invisible to testmon; use `pytest --testmon` for incremental local runs.
addopts = ""
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "slow: optional long-running stress tests (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
]

[tool.ruff]
# General ruff settings
line-length = 88
fix = true
unsafe-fixes = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
