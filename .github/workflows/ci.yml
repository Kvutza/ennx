name: CI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform slice to run
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu-24.04
          - macos-14
      target:
        description: Work to run
        required: true
        default: all
        type: choice
        options:
          - all
          - build-test
          - wheel

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }} / ${{ inputs.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["ubuntu-24.04","macos-14"]' || format('["{0}"]', inputs.platform)) }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: latest
          cache: true
          environments: ennx ennx-py312 ennx-py314
          locked: true

      - name: Restore Buck2 cache
        uses: actions/cache@v4
        with:
          path: |
            .buck2-tools
            buck-out/dev
            buck-out/release
            buck-out/release-py312
            buck-out/release-py313
            buck-out/release-py314
          key: ${{ runner.os }}-buck2-${{ hashFiles('.buckconfig', '.buckroot', 'BUCK', 'buck2/**', 'rust/BUCK', 'rust/crates/**/BUCK', 'pixi.lock', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-buck2-

      - name: Install OpenCL development package
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev

      - name: Install environment
        run: |
          pixi install -e ennx --locked
          pixi install -e ennx-py312 --locked
          pixi install -e ennx-py314 --locked

      - name: Build and test
        if: inputs.target == 'all' || inputs.target == 'build-test'
        run: |
          pixi run -e ennx buck2-build
          pixi run -e ennx buck2-test

      - name: Build wheel
        if: inputs.target == 'all' || inputs.target == 'wheel'
        run: |
          for spec in "3.12:ennx-py312" "3.13:ennx" "3.14:ennx-py314"; do
            python_version=${spec%%:*}
            environment=${spec#*:}
            isolation=release-py${python_version//./}
            pixi run -e "$environment" bash ./buck2w --isolation-dir "$isolation" \
              build //:wheel \
              --config ennx.profile=release \
              --config "ennx.python_version=$python_version" \
              --local-only --num-threads 4 --show-output
          done
          for spec in "3.12:ennx-py312" "3.13:ennx" "3.14:ennx-py314"; do
            python_version=${spec%%:*}
            environment=${spec#*:}
            pixi run -e "$environment" \
              env ENNX_PYTHON_VERSION="$python_version" \
              ENNX_PYTHON=".pixi/envs/$environment/bin/python" \
              tools/buck2-wheel-verify
          done

      - name: Collect wheel artifacts
        if: inputs.target == 'all' || inputs.target == 'wheel'
        run: |
          mkdir -p artifacts
          find buck-out/release-py312 buck-out/release-py313 buck-out/release-py314 \
            -type f -name 'ennx-*.whl' -exec cp {} artifacts/ \;
          test "$(find artifacts -type f -name 'ennx-*.whl' | wc -l | tr -d ' ')" -eq 3

      - name: Upload wheel artifacts
        if: inputs.target == 'all' || inputs.target == 'wheel'
        uses: actions/upload-artifact@v4
        with:
          name: ennx-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error
