name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new v* release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: latest
          cache: true
          environments: ennx ennx-py312 ennx-py314
          locked: true

      - name: Restore Buck2 cache
        uses: actions/cache@v4
        with:
          path: |
            .buck2-tools
            buck-out/dev
            buck-out/release
            buck-out/release-py312
            buck-out/release-py313
            buck-out/release-py314
          key: ${{ runner.os }}-buck2-${{ hashFiles('.buckconfig', '.buckroot', 'BUCK', 'buck2/**', 'rust/BUCK', 'rust/crates/**/BUCK', 'pixi.lock', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-buck2-

      - name: Install OpenCL development package
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev

      - name: Install environment
        run: |
          pixi install -e ennx --locked
          pixi install -e ennx-py312 --locked
          pixi install -e ennx-py314 --locked

      - name: Run platform build and tests
        run: |
          ./buck2w --isolation-dir dev build \
            //rust/crates/bpann:bpann \
            //rust/crates/ennx:ennx \
            //rust/crates/ennx-py:ennx-py \
            //rust/crates/dev-cli:ennx \
            --local-only --num-threads 4 -M none
          ./buck2w --isolation-dir dev test \
            //buck2/tests:all \
            --local-only --num-threads 4

      - name: Test Python wheel
        run: |
          pixi run -e ennx \
            env ENNX_PYTHON_VERSION=3.13 \
            ENNX_PYTHON=.pixi/envs/ennx/bin/python \
            tools/buck2-wheel-verify --tests

      - name: Build wheel
        run: |
          for spec in "3.12:ennx-py312" "3.13:ennx" "3.14:ennx-py314"; do
            python_version=${spec%%:*}
            environment=${spec#*:}
            isolation=release-py${python_version//./}
            pixi run -e "$environment" bash ./buck2w --isolation-dir "$isolation" \
              build //:wheel \
              --config ennx.profile=release \
              --config "ennx.python_version=$python_version" \
              --local-only --num-threads 4 --show-output
          done
          for spec in "3.12:ennx-py312" "3.13:ennx" "3.14:ennx-py314"; do
            python_version=${spec%%:*}
            environment=${spec#*:}
            pixi run -e "$environment" \
              env ENNX_PYTHON_VERSION="$python_version" \
              ENNX_PYTHON=".pixi/envs/$environment/bin/python" \
              tools/buck2-wheel-verify
          done

      - name: Collect wheel artifacts
        run: |
          mkdir -p release
          find buck-out/release-py312 buck-out/release-py313 buck-out/release-py314 \
            -type f -name 'ennx-*.whl' -exec cp {} release/ \;
          test "$(find release -type f -name 'ennx-*.whl' | wc -l | tr -d ' ')" -eq 3

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ennx-${{ matrix.os }}
          path: release/
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in v*) ;; *) exit 2 ;; esac
          cp README LICENSE NOTICE release/
          if gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null; then
            gh release upload "$RELEASE_TAG" release/* \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
